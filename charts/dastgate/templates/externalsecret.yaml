{{- /*
Optional secrets backend for clusters running External Secrets Operator
(https://external-secrets.io). Enable with externalSecret.enabled=true and point
secretStoreRef at your store (Vault, AWS/GCP/Azure/OCI, etc.). ESO materialises a
Secret named the same as the plain Secret would be, so the CronJob is unchanged.
*/ -}}
{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dastgate.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dastgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "dastgate.secretName" . }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end -}}
