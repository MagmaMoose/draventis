{{- if .Values.externalSecrets.enabled }}
# Pulls the DefectDojo API token + the whole targets.yaml document from OCI Vault
# (via External Secrets Operator) into one Secret the CronJob consumes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dastgate.fullname" . }}
  labels: {{- include "dastgate.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.store }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "dastgate.fullname" . }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DEFECTDOJO_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.defectDojoTokenKey }}
    # A full targets.yaml document (see docs/DESIGN.md §5.3), mounted as a file.
    - secretKey: targets.yaml
      remoteRef:
        key: {{ .Values.externalSecrets.targetsKey }}
{{- end }}
