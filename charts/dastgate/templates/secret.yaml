{{- /*
Default secrets backend: a plain Kubernetes Secret the CronJobs `envFrom`.
Created unless externalSecret.enabled=true (then externalsecret.yaml owns it).
Works on any cluster with no extra operators.
*/ -}}
{{- if not .Values.externalSecret.enabled -}}
{{- $data := dict -}}
{{- with .Values.secret.defectDojoToken }}{{- $_ := set $data "DEFECTDOJO_TOKEN" . }}{{- end -}}
{{- range $k, $v := .Values.secret.env }}{{- $_ := set $data $k $v }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dastgate.secretName" . }}
  labels:
    {{- include "dastgate.labels" . | nindent 4 }}
type: Opaque
{{- if $data }}
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end -}}
