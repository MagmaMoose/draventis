{{- /*
One CronJob per enabled schedule (nightly, weekly). Each runs
`dastgate run --schedule <name>`, which scans only the targets whose schedule
matches. concurrencyPolicy Forbid + activeDeadlineSeconds stop a hung scan from
piling up or running forever.
*/ -}}
{{- /*
  Reviewed KICS suppressions (accepted risk / not applicable to a distributable chart):
    02323c00  runAsUser 1000 IS the base image's own non-root user (raising it breaks file ownership)
    a9c2f49d  ZAP needs a writable root filesystem (session/config live under $HOME)
    caa3479d / 7c81d34c  the image ref is user-configurable — a chart can't pin a digest / force Always
    4a20ebac / 48a5beba  LimitRange / ResourceQuota are namespace policy, not an app chart's concern
    3d658f8b  env-var secret delivery (envFrom) is the intended token/credential mechanism
*/ -}}
# kics-scan disable=02323c00-cdc3-4fdc-a310-4f2b3e7a1660,a9c2f49d-0671-4fc9-9ece-f4e261e128d0,caa3479d-885d-4882-9aac-95e5e78ef5c2,7c81d34c-8e5a-402b-9798-9f442630e678,4a20ebac-1060-4c81-95d1-1f7f620e983b,48a5beba-e4c0-4584-a2aa-e6894e4cf424,3d658f8b-d988-41a0-a841-40043121de1e
{{- range $sched, $cfg := .Values.schedules }}
{{- if $cfg.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dastgate.fullname" $ }}-{{ $sched }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dastgate.labels" $ | nindent 4 }}
    dastgate.io/schedule: {{ $sched }}
spec:
  schedule: {{ $cfg.cron | quote }}
  concurrencyPolicy: {{ $.Values.concurrencyPolicy }}
  {{- with $.Values.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  successfulJobsHistoryLimit: {{ $.Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $cfg.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          annotations:
            container.apparmor.security.beta.kubernetes.io/dastgate: runtime/default
          labels:
            {{- include "dastgate.selectorLabels" $ | nindent 12 }}
            dastgate.io/schedule: {{ $sched }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "dastgate.serviceAccountName" $ }}
          automountServiceAccountToken: false
          {{- with $.Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          {{- with $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ include "dastgate.fullname" $ }}-config
            - name: workdir
              emptyDir: {}
          containers:
            - name: dastgate
              image: {{ include "dastgate.image" $ | quote }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args:
                - run
                - --schedule
                - {{ $sched }}
                - --config
                - /config/targets.yaml
                - --plans-dir
                - /automation
              envFrom:
                - secretRef:
                    name: {{ include "dastgate.secretName" $ }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: workdir
                  mountPath: /zap/wrk
{{- end }}
{{- end }}
