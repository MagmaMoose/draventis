{{- /*
dastgate needs NO Kubernetes API access — it only makes HTTP requests to scan
targets and to DefectDojo. So this ServiceAccount has no RBAC bound to it: a
deliberately minimal blast radius.
*/ -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dastgate.serviceAccountName" . }}
  labels:
    {{- include "dastgate.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end -}}
