# =============================================================================
# dastgate — Helm values
#
# Scheduled DAST (OWASP ZAP + Nuclei) against already-deployed targets, with
# results reimported into DefectDojo. Override the sections you need; the
# defaults install cleanly on any cluster (they just scan example.com passively
# and upload nowhere until you set defectDojo.url).
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# --- Scanner image ------------------------------------------------------------
# The published image bundles ZAP + headless browsers + Nuclei + the dastgate
# CLI (see the repo Dockerfile). Point `repository` at your own registry if you
# build it yourself.
image:
  repository: ghcr.io/magmamoose/dastgate
  tag: "" # defaults to the chart appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# --- Targets ------------------------------------------------------------------
# The list of hosts/services to scan. Rendered into targets.yaml (a ConfigMap)
# and mounted at /config/targets.yaml. Replace with your own targets.
#   policy:   baseline (passive, prod-safe) | full (active, staging ONLY) | api
#   schedule: nightly | weekly  -> which CronJob runs it
targets:
  - name: example
    url: https://example.com
    policy: baseline
    schedule: nightly
  # - name: app-staging
  #   url: https://app.staging.example.com
  #   product: example/app          # DefectDojo product name (defaults to name)
  #   policy: full                   # active scan — staging only!
  #   schedule: weekly
  #   openapi: https://app.staging.example.com/openapi.json
  #   auth:
  #     type: browser-oidc           # drive a real OIDC login headlessly
  #     login_url: https://app.staging.example.com/login
  #     user_env: ZAP_USER           # creds come from the Secret (below)
  #     pass_env: ZAP_PASS

# --- Config defaults ----------------------------------------------------------
# Applied to every target that does not set the field itself.
defaults:
  policy: baseline
  schedule: nightly
  tags:
    - dast

# --- DefectDojo sink ----------------------------------------------------------
# The sink is enabled by the presence of `url`. Leave it empty to run scans
# without uploading. The API token is a SECRET (see secret.defectDojoToken),
# never set here.
defectDojo:
  url: "" # e.g. https://defectdojo.example.com
  productType: "" # optional DefectDojo product-type grouping
  engagementPrefix: "DAST - "
  autoCreateContext: true # DefectDojo creates product/engagement/test on first run
  closeOldFindings: true # fixed alerts auto-mitigate per engagement
  tags:
    - dast

# --- Nuclei -------------------------------------------------------------------
# The fast templated complement to ZAP. `-dast` fuzzing is enabled automatically
# only for non-baseline (staging) targets.
nuclei:
  enabled: false

# --- Schedules -> CronJobs ----------------------------------------------------
schedules:
  nightly:
    enabled: true
    cron: "0 3 * * *" # 03:00 daily — passive baseline (+ Nuclei if enabled)
    activeDeadlineSeconds: 5400
  weekly:
    enabled: false # turn on once you have staging targets + auth wired
    cron: "0 4 * * 0" # 04:00 Sunday — full active, staging only
    activeDeadlineSeconds: 10800
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

# --- Secrets ------------------------------------------------------------------
# Two mutually exclusive backends. By default the chart creates a plain Secret
# from the values here — works on any cluster. Provide these via `helm install
# --set` / a values file / `--set-file`, not by committing them.
secret:
  defectDojoToken: "" # DefectDojo API token (env DEFECTDOJO_TOKEN)
  # Extra env vars for authenticated scans, e.g. per-target ZAP creds:
  env: {}
  #   ZAP_USER: scanbot
  #   ZAP_PASS: change-me

# Optional: source secrets from External Secrets Operator instead of the plain
# Secret above (Vault / AWS / GCP / Azure / OCI ...). When enabled, the chart
# emits an ExternalSecret and does NOT template the values under `secret`.
# Requires External Secrets Operator >= v0.10 (uses the external-secrets.io/v1
# API; v1beta1 was removed in ESO v0.17).
externalSecret:
  enabled: false
  secretStoreRef:
    name: "" # e.g. cluster-secret-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  # Map remote keys -> the env keys dastgate expects (DEFECTDOJO_TOKEN, ZAP_*).
  data: []
  #   - secretKey: DEFECTDOJO_TOKEN
  #     remoteRef:
  #       key: dastgate-defectdojo-token

# --- ServiceAccount -----------------------------------------------------------
# dastgate needs NO Kubernetes API access, so the account has no RBAC and does
# not mount a token.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Pod / container hardening ------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  # A numeric UID is REQUIRED: with runAsNonRoot and a non-numeric image user the
  # kubelet cannot verify non-root and the pod never starts. 1000 = the `zap`
  # user in the zaproxy base image.
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000 # gid 1000 owns the /zap/wrk emptyDir
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false # ZAP writes to /zap/wrk (mounted emptyDir)
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  # No limits by default — scan pods are bursty; add limits if your cluster
  # requires them.

nodeSelector: {}
tolerations: []
affinity: {}
