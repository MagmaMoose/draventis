# =============================================================================
# dastgate — Helm values (Phase 1: nightly ZAP baseline → DefectDojo)
#
# One CronJob runs the dastgate image (`dastgate run --all`) on a schedule. It
# reads the target list + DefectDojo token from a Secret that External Secrets
# Operator materialises from OCI Vault (see externalSecrets below). The scan is a
# passive baseline — prod-safe. Nuclei and full-active/authenticated scans land in
# later phases.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/magmamoose/dastgate
  tag: "" # defaults to Chart.appVersion; a Flux ImagePolicy can bump it
  pullPolicy: IfNotPresent

# Nightly passive baseline. concurrencyPolicy Forbid + activeDeadlineSeconds so a
# hung scan can never overlap or run forever.
schedule: "0 3 * * *"
concurrencyPolicy: Forbid
backoffLimit: 1
activeDeadlineSeconds: 5400 # 90 min
args: ["run", "--all"]

# DefectDojo sink. In-cluster service DNS (no Cloudflare round-trip; avoids the
# edge WAF that 1010-blocks urllib). The API token comes from ESO, never here.
defectDojo:
  url: http://defectdojo-django.security.svc.cluster.local
  productType: "DAST"

# External Secrets Operator (OCI Vault). One Secret carries the DefectDojo token
# (env) + the whole targets.yaml document (mounted file). Provision these two OCI
# Vault keys once; nothing target-specific lives in git.
externalSecrets:
  enabled: true
  store: oci-vault
  storeKind: ClusterSecretStore
  refreshInterval: "1h"
  defectDojoTokenKey: dastgate-defectdojo-token # OCI Vault key → DEFECTDOJO_TOKEN
  targetsKey: dastgate-targets # OCI Vault key → targets.yaml

# Heavy scan pods pinned to the worker node (house convention); CPU request only
# (no CPU limit), memory limited. dastgate talks only HTTP to targets + DefectDojo,
# so it needs no ServiceAccount token (set on the pod spec).
nodeSelector:
  node-role.kubernetes.io/worker: ""
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    memory: "4Gi" # ZAP + JVM is memory-hungry
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
