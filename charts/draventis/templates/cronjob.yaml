{{- /*
One CronJob per enabled schedule (nightly, weekly). Each runs
`draventis run --schedule <name>`, which scans only the targets whose schedule
matches. concurrencyPolicy Forbid + activeDeadlineSeconds stop a hung scan from
piling up or running forever.
*/ -}}
{{- /*
  Accepted low/none KICS findings for this chart (not fixable in a distributable
  app chart; the security gate is set to fail_on: medium):
    a9c2f49d  readOnlyRootFilesystem: false — ZAP writes session/config under $HOME
    caa3479d / 7c81d34c  the image ref is user-configurable — can't pin a digest / force Always
    4a20ebac / 48a5beba  LimitRange / ResourceQuota are namespace policy, not an app chart's concern
    3d658f8b  env-var secret delivery (envFrom) is the intended credential mechanism
*/ -}}
{{- range $sched, $cfg := .Values.schedules }}
{{- if $cfg.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "draventis.fullname" $ }}-{{ $sched }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "draventis.labels" $ | nindent 4 }}
    draventis.io/schedule: {{ $sched }}
spec:
  schedule: {{ $cfg.cron | quote }}
  concurrencyPolicy: {{ $.Values.concurrencyPolicy }}
  {{- with $.Values.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  successfulJobsHistoryLimit: {{ $.Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $cfg.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          annotations:
            container.apparmor.security.beta.kubernetes.io/draventis: runtime/default
          labels:
            {{- include "draventis.selectorLabels" $ | nindent 12 }}
            draventis.io/schedule: {{ $sched }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "draventis.serviceAccountName" $ }}
          automountServiceAccountToken: false
          {{- with $.Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          {{- with $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ include "draventis.fullname" $ }}-config
            - name: workdir
              emptyDir: {}
          containers:
            - name: draventis
              image: {{ include "draventis.image" $ | quote }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args:
                - run
                - --schedule
                - {{ $sched }}
                - --config
                - /config/targets.yaml
                - --plans-dir
                - /automation
              envFrom:
                - secretRef:
                    name: {{ include "draventis.secretName" $ }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: workdir
                  mountPath: /zap/wrk
{{- end }}
{{- end }}
