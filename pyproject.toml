# dastgate — Phase 1 (nightly ZAP baseline → DefectDojo).
#
# The `src/dastgate` package renders + runs a ZAP Automation Framework plan and
# reimports the report into DefectDojo over its REST API (stdlib `urllib`, mirroring
# chargate). The scan engines (ZAP, Nuclei) run as pinned binaries in the container,
# not as Python deps; the one runtime dep is a YAML parser for `targets.yaml`.
[project]
name = "dastgate"
version = "0.1.0"
description = "Scheduled DAST (OWASP ZAP + Nuclei) against deployed environments, reimported into DefectDojo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Caleb Sargeant", email = "caleb@magmamoose.com" }]
keywords = ["security", "dast", "zap", "nuclei", "defectdojo", "sarif"]
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
dastgate = "dastgate.__main__:main"

[project.urls]
Homepage = "https://github.com/MagmaMoose/dastgate"
Source = "https://github.com/MagmaMoose/dastgate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dastgate"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
