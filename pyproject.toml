# dastgate — Python package metadata.
#
# The DefectDojo client is stdlib `urllib` (no HTTP deps); the scan engines (ZAP,
# Nuclei) run as pinned binaries in the container image, not as Python deps. The
# only runtime dependency is a YAML parser for `targets.yaml`.
[project]
name = "dastgate"
version = "0.1.0"
description = "Scheduled DAST (OWASP ZAP + Nuclei) against deployed environments, reimported into DefectDojo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Caleb Sargeant", email = "caleb@magmamoose.com" }]
keywords = ["security", "dast", "zap", "nuclei", "defectdojo", "cronjob", "helm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["PyYAML>=6"]

[project.scripts]
dastgate = "dastgate.__main__:main"

[project.urls]
Homepage = "https://github.com/MagmaMoose/dastgate"
Source = "https://github.com/MagmaMoose/dastgate"
Documentation = "https://github.com/MagmaMoose/dastgate/tree/main/docs"
Issues = "https://github.com/MagmaMoose/dastgate/issues"
Changelog = "https://github.com/MagmaMoose/dastgate/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dastgate"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# Release versioning (python-semantic-release, driven by the Diatreme release
# workflow). The presence of this table also selects the semantic-release-python
# versioning tool. The version is derived from Conventional Commit history and
# written to pyproject, the package __version__, and the chart appVersion.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/dastgate/__init__.py:__version__",
    "charts/dastgate/Chart.yaml:appVersion",
]
allow_zero_version = true # stay on 0.x (project is alpha); first release is 0.1.0
