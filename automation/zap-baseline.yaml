# OWASP ZAP Automation Framework plan — passive BASELINE scan.
#
# Rendered by dastgate at runtime (src/dastgate/zap.py): ${TARGET_URL},
# ${REPORT_DIR} and ${REPORT_FILE} are substituted per target BEFORE ZAP runs, so
# ZAP receives literal values. reportFile has no extension → ZAP appends the
# template's (.xml), yielding ${REPORT_DIR}/${REPORT_FILE}.xml — exactly what
# DefectDojo's "ZAP Scan" parser ingests.
#
# Baseline = spider + passive rules only (NO active attacks, NO ajaxSpider) — safe
# to run nightly against prod-facing hosts. The full-active plan (staging only) is
# a later phase. Targets/credentials come only from OCI-Vault config we control,
# never from a scanned response.
env:
  contexts:
    - name: dastgate-target
      urls:
        - "${TARGET_URL}"
      includePaths:
        - "${TARGET_URL}.*"
      excludePaths:
        - ".*/logout.*"
        - ".*/admin/delete.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  # Configure the passive scanner (all passive rules, in-scope only).
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true

  # Crawl to seed the tree (traditional spider only — no ajaxSpider).
  - type: spider
    parameters:
      context: dastgate-target
      url: "${TARGET_URL}"
      maxDuration: 5
      maxDepth: 10
      maxChildren: 0

  # Drain the passive-scan queue before reporting.
  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  # Emit the traditional XML report DefectDojo's "ZAP Scan" parser ingests.
  - type: report
    parameters:
      template: traditional-xml
      reportDir: "${REPORT_DIR}"
      reportFile: "${REPORT_FILE}"
      reportTitle: "dastgate ZAP baseline"
      reportDescription: "Passive baseline scan of ${TARGET_URL} (dastgate)."
