# ---------------------------------------------------------------------------
# ZAP Automation Framework plan: passive baseline scan.
#
# This is the plan `draventis` runs for a target whose policy is `baseline`.
#
# Passive baseline = spider + passive rules only. NO active attacks and NO
# ajax-spider, so it is safe/non-destructive to run against production hosts.
# The target comes from the DRAVENTIS_TARGET_URL environment variable (ZAP AF
# substitutes ${VAR} at plan-load time). Targets and credentials MUST come only
# from config you control — never from a scanned response.
#
# Run:  zap.sh -cmd -autorun /path/to/zap-baseline.yaml
# Produces /zap/wrk/zap-baseline.xml -> reimport into DefectDojo as "ZAP Scan".
# ---------------------------------------------------------------------------

env:
  contexts:
    - name: baseline-target
      urls:
        - "${DRAVENTIS_TARGET_URL}"
      includePaths:
        # Pre-escaped regex (dots in the host are literal, not wildcards).
        - "${DRAVENTIS_TARGET_SCOPE_REGEX}"
      excludePaths:
        - ".*/logout.*"
        - ".*/admin/delete.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Configure the passive scanner (all passive rules on).
  - type: passiveScan-config
    parameters:
      enableTags: false
      scanOnlyInScope: true

  # Crawl the site to seed the tree (traditional spider only — no ajaxSpider,
  # so this stays passive and non-destructive).
  - type: spider
    parameters:
      context: baseline-target
      maxDuration: 5
      maxDepth: 10
      maxChildren: 0

  # Let passive scanning drain its queue before reporting.
  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  # Emit the traditional XML report DefectDojo's "ZAP Scan" parser ingests.
  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk
      reportFile: zap-baseline.xml
